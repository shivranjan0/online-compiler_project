<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/a351e9f1c5.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="con">
    <div class="left">
      <label><i class="fa-brands fa-html5"></i>HTML</label>
      <textarea id="html-code" onkeyup="run()"></textarea> 

      <label><i class="fa-brands fa-css3-alt"></i>CSS</label>
      <textarea id="css-code" onkeyup="run()"></textarea>

      <label><i class="fa-brands fa-js"></i>javascript</label>
      <textarea id="javascript-code" onkeyup="run()"></textarea>

    </div>
    <div class="right">
      <label><i class="fa-solid fa-play" style="color: #FFD43B;"></i>output</label>
      <iframe id="output"></iframe>
    </div>
  </div>
  

  <script>

    function run(){
      let htmlCode=document.getElementById("html-code").value;
      let cssCode=document.getElementById("css-code").value;
      let javascriptCode=document.getElementById("javascript-code").value;
      let outputCode=document.getElementById("output");

      output.contentDocument.body.innerHTML = htmlCode + "<style>" + cssCode + "</style>";
      output.contentWindow.eval(javascriptCode);
    }

  </script>
  
</body>
</html>
